[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starlight-rebuild"
version = "0.1.0"
description = "Read-only Starlight replay and future-run logging"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
science = ["scipy>=1.12,<2", "numpy>=1.26,<3", "pandas>=2,<4", "matplotlib>=3.8,<4"]
vision = ["opencv-contrib-python>=4.9,<5", "numpy>=1.26,<3"]
hardware = ["smbus2>=0.4,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1,<2"]

[project.scripts]
starlight = "starlight.cli:main"

[tool.setuptools]
packages = ["starlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
